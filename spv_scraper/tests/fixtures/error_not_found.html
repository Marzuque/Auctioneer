    <title>Standard Presumptive Value</title>
    <meta name="keywords" content="buying a vehicle from an individual, standard presumptive value, sales tax, county tax office, vehicle appraisals, price digests">
    <meta name="description" content="All Texans who buy a used vehicle from anyone other than a licensed car dealer must pay sales tax on the vehicle's Standard Presumptive Value, which is determined by using the statewide sales data and valuation guide.">

    <style type='text/css'>
        @font-face {
            font-family: 'Francois One';
            font-style: normal;
            font-weight: 400;
            src: local('Francois One Regular'), local('FrancoisOne-Regular'), local('bYbkq2nU2TSx4SwFbz5sCHhCUOGz7vYGh680lGh-uXM.woff') format('woff');
        }

        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 12px;
            color: #636363;
        }

        input[type="text"], input[type="number"] {
            width: 90%;
            margin: 0 0 15px 0;
            display: block;
            height: calc(1.5em + 0.75rem + 2px);
            padding: 0.375rem 0.75rem;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #495057;
            background-color: #fff;
            -webkit-background-clip: padding-box;
            background-clip: padding-box;
            border-radius: 0.25rem;
        }

        input[type="submit"], button[type="submit"] {
            border-radius: 0;
            border: 1px solid #001e4c;
            background-color: #204eb8;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px #555;
            padding: 12px 25px;
            white-space: nowrap;
        }

        input[type="submit"]:hover, button[type="submit"]:hover {
            color: #fff;
            background-color: #132f70;
            border-color: #122b66;
        }

        a {
            text-decoration: none;
            color: #0000FF;
        }

        form#VehicleInfo table#query {
            width: 100%;
        }

        form#VehicleInfo input[type="text"],
        form#VehicleInfo input[type="number"], {
            font-family: 'Francois One', Helvetica, sans-serif;
        }

        table#result {
            width: 225px;
            border: 1px solid #d3d3d3;
            font-size: 0.75em;
        }

        td.contentarea {
            padding: 0.5em;
            border: 1px solid #d3d3d3;
            background: #fff;
        }

        table#result td.contentarea {
            font-family: Helvetica, Arial, sans-serif;
        }

        @media print {
            .printbutton {
                visibility: hidden;
                display: none;
            }
            table#result {
                font-size: 1.25em;
            }
        }
    </style>
